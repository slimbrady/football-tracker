track_low_thresh: 0.1
new_track_thresh: 0.6
track_buffer: 60
match_thresh: 0.8

# OC-SORT specific
det_thresh: 0.25
max_age: 60
min_hits: 3
iou_threshold: 0.3
delta_t: 3
inertia: 0.2
use_byte: true
